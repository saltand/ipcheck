# Publishes @saltand/ipcheck to npm when a GitHub Release is published
# (or via workflow_dispatch). Requires repo secret NPM_TOKEN:
# an npm Automation token with publish access to the @saltand scope.
# Do not commit tokens. Create a Release on GitHub to trigger publish.
name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
